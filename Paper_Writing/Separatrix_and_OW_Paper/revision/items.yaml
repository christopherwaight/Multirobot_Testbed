blocking:
  - id: B1
    title: "Theorem 1's exact-estimate hypothesis vs the D tracker's true positive-definite H_D over the outer half of each segment"
    sources: [v1-B1]
    severity: blocking
    phase: 4
    location: "thm:separatrix (~1230-1250), sec:stability, Table II caption"
    note: >
      RESOLVED via v1's documented fallback, not the preferred guard change.
      The transverse-eigenvector guard (guard='transverse' in
      pentagon_primitives.py, kept as an opt-in, non-default mode) was tried
      2026-08-04 and fails completely on the clean six-start benchmark (0/6
      traverse), even after fixing an initial sign-vs-magnitude bug in the
      restoring term -- a fuller re-derivation than a same-session patch, so
      not pursued further. Instead: Theorem 1's hypothesis is now qualified
      in text (fields where Sigma is concave along Gamma; the double gyre is
      not in that class for D over |y| > 0.25), and the Table II caption
      notes a_perp,D is evaluated on the realized fit, not exact estimates.
      No code change, no re-run needed; the guard is exactly as published.
    gate:
      type: tex
      present_all:
        - 'guard\s+are in tension on this benchmark'
        - 'on the realized fit, not on exact estimates'

  - id: A3
    title: "D tracker has the same flow-stagnation exposure at the saddle that the paper flags against the s1 tracker (one-sided VI-D comparison)"
    sources: [v2-A3]
    severity: blocking
    phase: 4
    location: "sec:disc_noise (VI-D) ~2001, IV-D flow-stagnation argument ~1160"
    note: >
      Resolved 2026-08-04 as a text addition (no new sim needed beyond the
      already-recorded clean-run closest-approach data, 0.0003-0.0194): one
      sentence acknowledges v0_hat collapses at the same stagnation point,
      and that the clean runs already show the re-signing survives it.
    gate:
      type: tex
      present: 'not\s+free of the exposure'

  - id: B2
    title: "Ocean s_trim/beta-latch claim (\"a property of the field and not of a setting\") vs Table I's 6x change in s_trim; ride-speed diagnostic"
    sources: [v1-B2]
    severity: blocking
    phase: 1
    location: "sec:disc_ocean (VI-F), Table I s_trim row"
    note: >
      Resolved 2026-08-04 via ocean_diagnostics.py: beta latched at step 0
      and stayed latched the whole 168-step run (fraction 1.0), realized
      speed 0.772-0.775 m/s essentially pinned at k*c_max*tanh(1), both now
      stated in text. This is GOOD news for VI-F's claim (the ride did
      engage, contrary to the review's worry it might never latch) but
      surfaced a separate, more serious finding while computing it: the
      divergence ratio 2|mu|/r along the corridor has median 0.8-1.1, not
      the "empirically small" the old text claimed -- v2's own threshold
      ladder (>0.05 needs the general form in II-C and a qualified
      splitting-identity reading) is well exceeded. Text corrected to state
      the measured ratio and walk back "empirically small"; flagged
      prominently to the user rather than silently patched, since it
      changes a substantive claim, not just a decimal. II-C itself may
      still want the general (non-incompressible) form of (5) stated
      explicitly given this -- not yet done, left as a should-fix.
    gate:
      type: tex
      present_all:
        - 'latched at the very first step'
        - 'median \$0\.8\$'

  - id: A2
    title: "VI-E's 0.000 mean distance vs VI-D's 0.0075 zero-noise tracking error, same tracker same field"
    sources: [v2-A2]
    severity: blocking
    phase: 4
    location: "sec:objectivity_tradeoff (VI-E) ~2001, sec:disc_noise (VI-D) ~1941"
    note: >
      Resolved 2026-08-04: recomputed the raw value directly from
      traverse_objectivity_demo.py (1.53e-7, not a rounding artifact of the
      0.0 in the CSV). It is a DIFFERENT metric than VI-D's |x_c|
      (trench_network_distance measures distance to the nearest wall/
      domain-boundary line, x in {-1,0,1} or y in {-0.5,0.5}, for one
      deterministic run at heading 0 from (0.05, 0.40); VI-D's 0.0075 is a
      trial mean over random heading). Text now states both the number and
      the metric mismatch, so the two figures need no reconciliation.
    gate:
      type: tex
      absent_all:
        - 'trench network of 0\.000 inertial'
      present: 'not directly comparable'

  - id: B3
    title: "Abstract's \"fundamental tradeoff\" is contradicted by VI-D's clean-channel ablation restoring 100%/95.7%"
    sources: [v1-B3]
    severity: blocking
    phase: 4
    location: "Draft_6a.tex:51 (abstract)"
    gate:
      type: tex
      absent: 'demonstrate a fundamental tradeoff'

  - id: B4_M1
    title: "Discrete instability threshold is 2(1+alpha), not (1+sqrt alpha)^2. No reported number changes (11.3 is what the CORRECT bound gives; the old formula should have rounded to 11.2)."
    sources: [v1-B4, v1-M1]
    severity: blocking
    phase: 4
    location: "sec:stability ~1343-1345, Table II caption ~1359"
    note: "Fixed 2026-08-04: full ladder stated in prose, caption formula corrected to 2(1+alpha_mom). Earlier gate regex had a spurious \\right) that never matched anything, so it was a false pass -- verify any 'absent' gate actually matches current text before trusting it."
    gate:
      type: tex
      absent_all:
        - '\(1\s*\+\s*\\sqrt\{\\alpha_\{\\text\{mom\}\}\}\)\^2\$\.\s*The lag'
        - '\(1-\\alpha_\{\\text\{mom\}\}\)\s*>\s*\(1\+\\sqrt\{\\alpha_\{\\text\{mom\}\}\}\)\^2'

  - id: A1
    title: "Ring-phase / cluster-heading policy is never stated in V-A (held fixed per run, per pentagon_cluster.py:163)"
    sources: [v2-A1]
