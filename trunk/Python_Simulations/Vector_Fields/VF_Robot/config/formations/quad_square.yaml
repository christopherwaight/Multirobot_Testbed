# 4-robot square formation configuration
# Used for 1XX series (orbit101-160) comparisons
# Square with equal diagonal lengths

formation:
  type: "quadrilateral"
  d1: 0.3          # Diagonal 1 length (robot 1 to 3)
  d2: 0.3          # Diagonal 2 length (robot 2 to 4)
  r1: 0.5          # Intersection ratio diagonal 1 (centered)
  r2: 0.5          # Intersection ratio diagonal 2 (centered)
  phi_degrees: 90.0  # Angle between diagonals (square)
  position_gain: 1.0  # Formation control gain