# equilateral_radius_sweep.yaml
# Custom formation for radius sweep experiments
# Small equilateral triangle configuration for 3-robot cluster
#
# SAS Parameterization:
#   p = 0.33: Distance from robot 1 to robot 2
#   q = 0.33: Distance from robot 2 to robot 3
#   beta = 120°: Angle at robot 2 (equilateral triangle)

formation:
  p: 0.33                # Side length 1-2
  q: 0.33                # Side length 2-3
  beta_degrees: 60.0    # Angle at robot 2 (equilateral)
  position_gain: 1.0     # Formation control gain
