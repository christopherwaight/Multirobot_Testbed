# Ocean HF radar, Santa Barbara Channel, May 16-17 2012 -- time-varying variant.
# Loads all 29 hourly frames and linearly interpolates u, v in time.
# Used by experiments/main_ocean_hfr_v6r_timevarying.py.
#
# Time math at default settings:
#   cluster.timestep = 0.1 s
#   TIME_WARP = 360 (default in experiment)
#   -> each sim step advances field.t by 36 s
#   -> 110 sim steps = 3960 s = 1.1 HFR frames traversed
#   -> for full 28-hour dataset in 110 steps: TIME_WARP ~= 9200

# Affine world-to-geographic mapping (same as static variant)
center_lat: 34.2
center_lon: -120.4
roi_half_deg: 0.3
world_half: 0.65

# Time handling
enable_time_interp: true
frame_glob: "*_6km_rtv_uwls_SIO.nc"
cache_key: "ocean_hfr_timevarying"
