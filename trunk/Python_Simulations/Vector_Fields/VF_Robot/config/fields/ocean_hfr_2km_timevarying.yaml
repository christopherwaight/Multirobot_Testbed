# Ocean HF radar, Santa Barbara Channel, May 16-17 2012 -- 2km native resolution,
# time-varying variant. Loads all 29 hourly frames and linearly interpolates u, v in time.
# Used by experiments/main_ocean_hfr_2km.py and experiments/main_ocean_hfr_2km_ftle_overlay.py.
#
# Same dataset window as ocean_hfr_timevarying.yaml (6km), but reads the 2km native-resolution
# HFR product instead. SBC valid-data coverage is lower at 2km (~48-58%) than 6km (~67%),
# see ocean_data/DATA_PROVENANCE.md.

# Affine world-to-geographic mapping (same ROI as the 6km variant).
# roi_half_deg is the LATITUDE half-extent. With isotropic_map on, the
# longitude half-extent is derived as roi_half_deg/cos(center_lat) = 0.3628 deg,
# so one world unit is 51.4 km both north and east and the map is a similarity.
# Set isotropic_map: false to reproduce runs from before 2026-08-03, when the
# same degree scale was applied to both axes (51.4 km north, 42.5 km east).
center_lat: 34.2
center_lon: -120.4
roi_half_deg: 0.3
world_half: 0.65
isotropic_map: true

# Time handling
enable_time_interp: true
data_dir: "/Users/christopherwaight/Desktop/Multirobot_Testbed/trunk/Python_Simulations/Vector_Fields/ocean_data/hfr_uswc_2012may_2km"
frame_glob: "*_2km_rtv_uwls_SIO.nc"
cache_key: "ocean_hfr_2km_timevarying"
