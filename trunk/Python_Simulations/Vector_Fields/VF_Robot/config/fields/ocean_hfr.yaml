# Ocean HF radar field, Santa Barbara Channel, May 16-17 2012.
# Data source: trunk/Python_Simulations/Vector_Fields/ocean_data/hfr_uswc_2012may/
# Mapping: world (x, y) in [-world_half, world_half] -> lat/lon ROI of half-width
# roi_half_deg centered on (center_lat, center_lon).

# Affine world-to-geographic mapping
center_lat: 34.2
center_lon: -120.4
roi_half_deg: 0.3        # +/- 0.3 deg (~33 km lat / ~28 km lon at 34N)
world_half: 0.65         # matches runner.py vector-field plot bounds [-0.65, 0.65]

# Time handling
enable_time_interp: false   # static field (first frame only). Flip to true to enable.
frame_glob: "*_6km_rtv_uwls_SIO.nc"
cache_key: "ocean_hfr_static"
