# Formation configuration: Small equilateral triangle
# SAS parameterization: (p, q, beta)
#
# p: distance from robot 1 to robot 2
# q: distance from robot 2 to robot 3
# beta: angle at robot 2 (in degrees)

formation:
  p: 0.3
  q: 0.3
  beta_degrees: 60.0

  # Formation control gains
  position_gain: 1.0    # Proportional gain for shape error correction
