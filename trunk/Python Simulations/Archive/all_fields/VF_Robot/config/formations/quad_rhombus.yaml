# quad_rhombus.yaml
# Rhombus (diamond) formation for 4-robot cluster
#
# Equal diagonals at non-perpendicular angle create rhombus

formation:
  type: "quadrilateral"
  d1: 0.3                # Equal diagonal lengths
  d2: 0.3
  r1: 0.5                # Diagonals bisect each other
  r2: 0.5
  phi_degrees: 60.0      # Non-perpendicular angle (makes rhombus, not square)
  position_gain: 1.0
