# 4-robot advanced formation configuration
# Used for 2XX series (orbit201-250) comparisons
# Two equilateral triangles sharing an edge

formation:
  type: "quadrilateral"
  d1: 0.433        # Diagonal 1 length (robot 1 to 3) - side of equilateral triangle
  d2: 0.25         # Diagonal 2 length (robot 2 to 4) - perpendicular distance
  r1: 0.5          # Intersection ratio diagonal 1 (centered)
  r2: 0.5          # Intersection ratio diagonal 2 (centered)
  psi_degrees: 90.0  # Angle between diagonals
  position_gain: 1.0  # Formation control gain