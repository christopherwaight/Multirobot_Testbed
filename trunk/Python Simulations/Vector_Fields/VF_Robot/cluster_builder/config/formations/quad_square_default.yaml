# quad_square_default.yaml
# Two equilateral triangles formation for 4-robot cluster
#
# Forms two equilateral triangles sharing an edge (robots 2-3):
#   Top triangle: robots 1, 2, 3
#   Bottom triangle: robots 2, 3, 4
#
# Diagonal parameterization:
#   d1 = 0.433: Length of diagonal 1-3 (side of top triangle)
#   d2 = 0.25: Length of diagonal 2-4 (perpendicular distance between triangles)
#   r1, r2: Intersection ratios
#   phi: Angle between diagonals (90° for this configuration)

formation:
  type: "quadrilateral"  # Required: identifies 4-robot formation
  d1: 0.3              # Diagonal 1 length (robot 1 to robot 3)
  d2: 0.3              # Diagonal 2 length (robot 2 to robot 4)
  r1: 0.5                # Intersection ratio for diagonal 1
  r2: 0.5                # Intersection ratio for diagonal 2
  psi_degrees: 90.0      # Angle between diagonals
  position_gain: 1.0     # Formation control gain
