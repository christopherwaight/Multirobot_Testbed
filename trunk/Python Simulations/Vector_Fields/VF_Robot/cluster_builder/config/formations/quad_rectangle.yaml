# quad_rectangle.yaml
# Square formation for 4-robot cluster
#
# Equal diagonals (d1=d2=0.25) with phi=90° creates a square
# This is configured so that it is two equilateral triangles

formation:
  type: "quadrilateral"
  d1: 0.25               # Equal diagonal lengths
  d2: 0.433
  r1: 0.5                # Diagonals bisect each other at center
  r2: 0.5
  psi_degrees: 90.0      # Perpendicular diagonals make square
  position_gain: 1.0
